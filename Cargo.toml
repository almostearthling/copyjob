[package]
name = "copyjob"
version = "0.6.1"
edition = "2024"

[dependencies]
time = "0.3"
regex = "1.7"
fs_extra = "1.2"
trash = "5.2"
dirs = "7.0"
sha2 = "0.11"
bstr = "1.13"
data-encoding = "2.3"
lazy_static = "1.5"
walkdir = "2.3"
toml = "1.1"
serde_json = "1.0"
cfgmap = { version = "0.4", features = ["from_toml"] }
clap = { version = "4.1", features = ["derive"] }
log = "0.4"
flexi_logger = "0.31"
nu-ansi-term = "0.50"
parking_lot = "0.12"
soft-canonicalize = { version = "0.5", features = ["dunce"] }

[profile.release]
strip = true        # strip executable
opt-level = "z"     # optimize for size
lto = true
panic = 'abort'     # remove garbage strings from executable
